version: '3.8'

services:
  # 1. PostgreSQL (For Tenants, Logs, Budgeting)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: gateway_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gateway_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Stack (For Rate Limiting + Vector Semantic Cache)
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. MLflow (For Tracing and A/B Experiments)
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5001:5000"
    # We use a local SQLite DB inside the container just to store MLflow run data
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    volumes:
      - mlflow_data:/mlflow

# Named volumes ensure your data isn't lost if you restart the containers
volumes:
  postgres_data:
  redis_data:
  mlflow_data: